<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="66" height="66" viewBox="0 0 66 66" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#00C896"/>
      <stop offset="35%" stop-color="#FF8A00"/>
      <stop offset="65%" stop-color="#FF4DA6"/>
      <stop offset="85%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <!-- subtle outer glows using Gaussian blur filters for each segment (lightweight) -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Safe-zone background is transparent; icon sits centered in 66x66 -->
  <!-- Stylized 'M' mountain polyline. Points chosen to stay away from edges. -->
  <polyline id="poly" points="12,50 24,20 33,36 42,20 54,50"
            fill="none"
            stroke="url(#g)"
            stroke-width="3.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#blur)" />

  <!-- Vertex nodes (small filled circles) with subtle colored glows -->
  <g id="nodes">
    <circle cx="24" cy="20" r="3" fill="#00C896" opacity="1" />
    <circle cx="33" cy="36" r="3" fill="#FF8A00" opacity="1" />
    <circle cx="42" cy="20" r="3" fill="#FF4DA6" opacity="1" />
  </g>

</svg>